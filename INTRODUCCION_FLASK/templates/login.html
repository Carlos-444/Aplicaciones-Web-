<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" /> 
</head>
<body>

    <!-- El fondo de toda la pantalla -->
<div class="bg-base-200 min-h-screen flex items-center justify-center p-4">

    <!-- es la tarjeta blanca con sombra -->
    <div class="card w-full max-w-sm bg-base-100 shadow-xl border border-base-300">

        <!-- cuerpo de la tarjeta -->
        <div class="card-body">
            <h1 class="card-title text-2xl font-bold justify-center mb-4">Iniciar Sesión</h1>

            {% if error %}
                <p style="color: red; font-weight: bold; text-align: center;">{{ error }}</p>
            {% endif %}

            <form action="/login" method="POST">  
                <label class="label font-semibold">Correo</label>
                <input type="email" name="correo" required class="input input-bordered w-full">
                <br><br>
                <label class="label font-semibold">Contraseña</label>
                <input type="password" name="password_hash" required class="input input-bordered w-full">
                <br><br>
                <button type="submit" class="btn btn-primary w-full">Entrar</button>
            </form>

            <p class="text-center text-sm mt-4">
                ¿No tienes una cuenta? <a href="/registro" class="link link-primary">Regístrate aquí</a>
            </p>
        </div>

    </div> 

</div>
</body>
</html>
