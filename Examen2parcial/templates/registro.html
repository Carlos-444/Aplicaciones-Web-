<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro y Lista de Autos</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>
 <body class="bg-base-200 min-h-screen flex items-center justify-center p-6">


    <!-- Tarjeta blanca centrada con sombra -->
    <div class="card w-full max-w-md bg-base-100 shadow-xl border border-base-300">

        <!-- Cuerpo de la tarjeta -->
        <div class="card-body">

            <p class="text-lg mt-2"><a href="{{ url_for('home') }}"> Volver</a></p>


    

    <form action="{{ url_for('registro') }}" method="POST">

        <h1  "card-title text-2xl font-bold justify-center mb-2">Formulario de Registro de Autos</h1>
        <label class="label font-semibold py-1">ID:</label><br>
        <input class="input input-bordered w-full"  type="number" name="id" placeholder="ID (opcional)"><br><br>

        <label class="label font-semibold py-1">Nombre / Marca:</label><br>
        <input class="input input-bordered w-full" type="text" name="nombre" required><br><br>

        <label  class="label font-semibold py-1">Modelo:</label><br>
        <input class="input input-bordered w-full" type="text" name="modelo" required><br><br>

        <label class="label font-semibold py-1">Color:</label><br>
        <input class="input input-bordered w-full" type="text" name="color" required><br><br>

        <label  class="label font-semibold py-1">Año:</label><br>
        <input class="input input-bordered w-full" type="number" name="ano" required><br><br>

        
        <button type="submit" class="btn btn-primary w-full mt-3">Registrar</button>
    </form>

    <hr>

    <h2>Lista de Autos Registrados</h2>

    <table border="1">
        <thead>
            <tr>
                <th >ID</th>
                <th>Nombre</th>
                <th>Modelo</th>
                <th>Color</th>
                <th>Año</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for auto in autos %}
            <tr>
                <td>{{ auto[0] }}</td>
                <td>{{ auto[1] }}</td>
                <td>{{ auto[2] }}</td>
                <td>{{ auto[3] }}</td>
                <td>{{ auto[4] }}</td>
                <td>
                    <a href="{{ url_for('editar', id=auto[0]) }}">Editar</a>
                    |
                    <a href="{{ url_for('eliminar', id=auto[0]) }}">Eliminar</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6">No hay autos registrados.</td>
            </tr>
            {% endfor %}

        </div>
</div>

        </tbody>
    </table>

</body>
</html>
