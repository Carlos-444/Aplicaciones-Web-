<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Auto</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-6">

     <!-- Tarjeta blanca centrada con sombra -->
    <div class="card w-full max-w-md bg-base-100 shadow-xl border border-base-300">

        <!-- Cuerpo de la tarjeta -->
        <div class="card-body">


    <h1 "card-title text-2xl font-bold justify-center mb-2">Editar Auto</h1>
    

    <form action="{{ url_for('editar', id=auto[0]) }}" method="POST">
        
        <input class="label font-semibold py-1" type="text" value="{{ auto[0] }}" readonly><br><br>

        <label>Nombre / Marca:</label><br>
        <input class="label font-semibold py-1" type="text" name="nombre" value="{{ auto[1] }}" required><br><br>

        <label>Modelo:</label><br>
        <input class="label font-semibold py-1" type="text" name="modelo" value="{{ auto[2] }}" required><br><br>

        <label>Color:</label><br>
        <input class="label font-semibold py-1" type="text" name="color" value="{{ auto[3] }}" required><br><br>

        <label>Año:</label><br>
        <input class="label font-semibold py-1" type="number" name="ano" value="{{ auto[4] }}" required><br><br>

         <button type="submit" class="btn btn-primary w-full mt-3">Regresar</button>

        
    </form>


    </div>
</div>

</body>
</html>
